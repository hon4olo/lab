name: Import Batch 03 production assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-batch03.yml'

permissions:
  contents: write

concurrency:
  group: snack-lab-batch03-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install image tooling
        run: python3 -m pip install --quiet pillow

      - name: Import and normalize Batch 03 art
