        run: |
          python3 <<'PY'
          import json
          import os
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen

          from PIL import Image, ImageOps

          ROOT = Path.cwd()
          RESAMPLE = Image.Resampling.LANCZOS

          def fetch(name: str) -> bytes:
              url = os.environ[name]
              request = Request(url, headers={"User-Agent": "SnackLab-Batch03-Importer/1.0"})
              with urlopen(request, timeout=120) as response:
                  return response.read()

          def write_background(env_name: str, relative_path: str) -> None:
              image = Image.open(BytesIO(fetch(env_name))).convert("RGB")
              image = ImageOps.fit(image, (2048, 1152), method=RESAMPLE, centering=(0.5, 0.5))
              path = ROOT / "public" / relative_path
              path.parent.mkdir(parents=True, exist_ok=True)
              image.save(path, "PNG", optimize=True)

          def repack_sprite(image: Image.Image, relative_path: str, size: tuple[int, int], fill: float = 0.90) -> None:
              image = image.convert("RGBA")
              bbox = image.getchannel("A").getbbox()
              if bbox is None:
                  raise RuntimeError(f"{relative_path}: alpha mask is empty")
              sprite = image.crop(bbox)
              max_size = (max(1, int(size[0] * fill)), max(1, int(size[1] * fill)))
              sprite.thumbnail(max_size, RESAMPLE)
              canvas = Image.new("RGBA", size, (0, 0, 0, 0))
              x = (size[0] - sprite.width) // 2
              y = (size[1] - sprite.height) // 2
              canvas.alpha_composite(sprite, (x, y))
              # Enforce a one-pixel transparent border for the manifest alpha gate.
              px = canvas.load()
              for x in range(size[0]):
                  px[x, 0] = (0, 0, 0, 0)
                  px[x, size[1] - 1] = (0, 0, 0, 0)
              for y in range(size[1]):
                  px[0, y] = (0, 0, 0, 0)
                  px[size[0] - 1, y] = (0, 0, 0, 0)
              path = ROOT / "public" / relative_path
              path.parent.mkdir(parents=True, exist_ok=True)
              canvas.save(path, "PNG", optimize=True)

          def write_sprite(env_name: str, relative_path: str, size: tuple[int, int], fill: float = 0.90) -> None:
              repack_sprite(Image.open(BytesIO(fetch(env_name))), relative_path, size, fill)

          def reuse_sprite(source_relative: str, target_relative: str, size: tuple[int, int], fill: float = 0.90) -> None:
              repack_sprite(Image.open(ROOT / "public" / source_relative), target_relative, size, fill)

          write_background("URL_ORDER", "assets/backgrounds/street-snack-bar-order.png")
          write_background("URL_PREP", "assets/stations/street/prep-background.png")
          write_background("URL_GRILL", "assets/stations/street/grill-background.png")
          write_background("URL_BUILD", "assets/stations/street/build-background.png")

          write_sprite("URL_CAT", "assets/characters/business-cat/flaming-full.png", (1024, 1024), 0.94)

