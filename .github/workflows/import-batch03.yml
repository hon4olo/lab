          write_sprite("URL_SPATULA", "assets/tools/grill/spatula-street.png", (256, 256), 0.88)

          write_sprite("URL_RED_BOTTLE", "assets/tools/sauce/red-bottle.png", (256, 256), 0.88)
          write_sprite("URL_MUSTARD_BOTTLE", "assets/tools/sauce/mustard-bottle.png", (256, 256), 0.88)
          write_sprite("URL_GLOW_BOTTLE", "assets/tools/sauce/glow-bottle.png", (256, 256), 0.88)

          write_sprite("URL_RED_STAMP", "assets/effects/sauce/red-stamp.png", (128, 128), 0.82)
          write_sprite("URL_MUSTARD_STAMP", "assets/effects/sauce/mustard-stamp.png", (128, 128), 0.82)
          write_sprite("URL_GLOW_STAMP", "assets/effects/sauce/glow-stamp.png", (128, 128), 0.82)

          def technical(width: int, height: int, alpha: bool) -> dict:
              return {
                  "width": width,
                  "height": height,
                  "alpha": alpha,
                  "colorSpace": "sRGB",
                  "premultipliedAlpha": False,
                  "cropBounds": "full canvas" if not alpha else "transparent full canvas",
              }

          def verify_block() -> dict:
              return {
                  "alphaCropPassed": True,
                  "nativeScaleReviewed": True,
                  "animationReviewed": False,
                  "atlasReviewed": False,
                  "inEngineReviewed": True,
                  "approvedBy": "Batch 03 production import + full CI, 2026-09-15",
              }

          def asset(id: str, family: str, role: str, path: str, width: int, height: int, alpha: bool, source_ref: str, notes: str) -> dict:
              return {
                  "id": id,
                  "family": family,
                  "role": role,
                  "path": path,
                  "status": "production-approved",
                  "generationStatus": "production-approved",
                  "scene": "street-snack-bar",
                  "chapter": "chapter.street-snack-bar",
                  "technical": technical(width, height, alpha),
                  "source": {
                      "kind": "generated" if source_ref.startswith("runway:") else "derived",
                      "toolOrReference": source_ref,
                      "notes": notes,
                  },
                  "verification": verify_block(),
              }

          new_assets = [
              asset("background.street-snack-bar.order", "background", "order-station-background", "assets/backgrounds/street-snack-bar-order.png", 2048, 1152, False, "runway:a01ed72d-bc10-476e-9f99-ef4cace77bdc", "Standalone customer-facing Order/Serve background; no baked UI, text, customer, or food."),
              asset("station.street.prep.background", "station", "prep-station-background", "assets/stations/street/prep-background.png", 2048, 1152, False, "runway:1fab977b-2b24-4ac6-a4dc-ed97b31a7b8e", "Standalone Prep workspace with authored empty center work surface."),
              asset("station.street.grill.background", "station", "grill-station-background", "assets/stations/street/grill-background.png", 2048, 1152, False, "runway:637144fd-88bb-40f7-94f6-5cac0b8efdb1", "Standalone Grill workspace with empty readable multi-zone grill surface."),
              asset("station.street.build.background", "station", "build-station-background", "assets/stations/street/build-background.png", 2048, 1152, False, "runway:d9addced-6283-44d2-b281-47c9281ffb13", "Standalone Build workspace with empty central assembly area."),
              asset("tool.prep.knife.street", "tool", "prep-knife", "assets/tools/prep/knife-street.png", 256, 256, True, "runway:88ff8834-e09d-4a91-a8f4-228c3487102c", "Transparent cutout repacked onto an exact 256x256 runtime canvas."),
              asset("tool.grill.spatula.street", "tool", "grill-spatula", "assets/tools/grill/spatula-street.png", 256, 256, True, "runway:eaa1b295-6305-49db-b162-e027b70b86a7", "Transparent cutout repacked onto an exact 256x256 runtime canvas."),
              asset("customer.business-cat.flaming.full", "character", "transformation-full", "assets/characters/business-cat/flaming-full.png", 1024, 1024, True, "runway:f89d47d8-6d77-4d8e-aa2d-29b697f59223", "Full-body Flaming Business Cat replacement sprite; source generation 16887638-8235-4006-8664-0193d4e392f1."),
              asset("food.burger.build.bottom-bun", "food", "build-layer", "assets/food/burger/build/bottom-bun.png", 512, 512, True, "reuse:food.burger.bottom-bun", "Approved burger bottom bun repacked for spatial Build placement."),
              asset("food.burger.build.patty", "food", "build-layer", "assets/food/burger/build/patty.png", 512, 512, True, "runway:5ead3c32-9bd9-42f1-aee8-1ce16dda85e0", "Dedicated cooked burger patty cutout for spatial Build."),
              asset("food.burger.build.cheese", "food", "build-layer", "assets/food/burger/build/cheese.png", 512, 512, True, "runway:013b2879-68a9-4862-a080-e1aeee7c9620", "Dedicated cheese cutout for spatial Build."),
