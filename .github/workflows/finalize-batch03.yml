name: Finalize Batch 03 verified assets

# Batch 03 integration retry 7: restore trackable build art and keep QA geometry aligned with authored stations.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-batch03.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: snack-lab-batch03-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Restore verified Batch 03 import
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/batch03
          mkdir -p /tmp/batch03
          gh run download 34988520825 \
            --repo "${GITHUB_REPOSITORY}" \
            --name "batch03-production-import-5d10a7f995c4922200b3641d7edb37ed6ed86e82" \
            --dir /tmp/batch03
          cp -a /tmp/batch03/. .

      - name: Align hands-on QA geometry to authored stations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/browser/hands-on-helpers.ts')
          text = path.read_text()

          prep_old = 'y: viewport.height * (portrait ? 0.45 : 0.48),'
          prep_new = 'y: viewport.height * (portrait ? 0.68 : 0.69),'
          if prep_old in text:
              text = text.replace(prep_old, prep_new, 1)
          elif prep_new not in text:
              raise RuntimeError('Prep drag target coordinate changed unexpectedly.')

          start = text.index('function grillGeometry(viewport: ViewportCase) {')
          end = text.index('\n\ninterface WorkspaceRect', start)
          grill = '''function grillGeometry(viewport: ViewportCase) {
            const portrait = viewport.width < viewport.height;
            const centerX = viewport.width * 0.5;
            const centerY = viewport.height * 0.66;
            return {
              source: {
                x: viewport.width * (portrait ? 0.20 : 0.14),
                y: viewport.height * 0.85,
              },
              spatula: {
                x: viewport.width * (portrait ? 0.80 : 0.86),
                y: viewport.height * 0.84,
              },
              slot: {
                x: centerX - viewport.width * (portrait ? 0.17 : 0.14),
                y: centerY - viewport.height * (portrait ? 0.075 : 0.085),
              },
            };
          }'''
          text = text[:start] + grill + text[end:]
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run project checks with restored assets
        run: npm run check

      - name: Commit verified Batch 03 assets and QA alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets \
            docs/ASSET_BATCH_03_SOURCE_MAP.md \
            docs/ASSET_BATCH_03_REQUIREMENTS.md \
            src/content/transformations.ts \
            tests/browser/asset-batch-02.spec.ts \
            tests/browser/hands-on-helpers.ts
          if git diff --cached --quiet; then
            echo "No Batch 03 changes to commit."
          else
            git commit -m "feat: finalize Batch 03 production assets"
            git push origin HEAD:main
          fi

      - name: Run focused Batch 03 visual QA
        run: npx playwright test --config playwright.config.ts tests/browser/visual-capture.spec.ts --grep "visual QA capture: desktop"
